[project]
name = "push-service"
version = "1.0.0"
description = "Push Notification Service with FCM and Web Push support"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "pydantic==2.5.3",
    "pydantic-settings==2.1.0",
    "httpx==0.26.0",
    "aio-pika==9.3.1",
    "redis[hiredis]==5.0.1",
    "google-auth==2.26.2",
    "google-auth-httplib2==0.2.0",
    "pywebpush==1.14.0",
    "py-vapid==1.9.0",
    "python-multipart==0.0.6",
    "python-dotenv==1.0.0",
    "gunicorn==21.2.0",
    "prometheus-client==0.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.26.0",
    "black>=23.7.0",
    "ruff>=0.0.280",
    "firebase-admin>=6.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]
