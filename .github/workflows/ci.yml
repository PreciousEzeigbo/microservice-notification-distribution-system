name: Notification Distribution Service CI

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]
permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      nodejs: ${{ steps.filter.outputs.nodejs }}
      user-service: ${{ steps.filter.outputs.user-service }}
      email-service: ${{ steps.filter.outputs.email-service }}
      push-service: ${{ steps.filter.outputs.push-service }}
      template-service: ${{ steps.filter.outputs.template-service }}
      api-gateway: ${{ steps.filter.outputs.api-gateway }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            python:
              - 'user-service/**/*.py'
              - 'push-service/**/*.py'
              - 'template-service/**/*.py'
              - 'user-service/**/requirements.txt'
              - 'push-service/**/requirements.txt'
              - 'template-service/**/requirements.txt'
              - 'pyproject.toml'
              - 'ruff.toml'
              - 'pytest.ini'
            nodejs:
              - 'email-service/**/*.ts'
              - 'email-service/**/*.js'
              - 'email-service/**/*.json'
            user-service:
              - 'user-service/**'
            email-service:
              - 'email-service/**'
            push-service:
              - 'push-service/**'
            template-service:
              - 'template-service/**'
            api-gateway:
              - 'api-gateway/**'

  # User Service - Django with traditional requirements.txt
  user-service:
    name: User Service (Django)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.user-service == 'true'
    defaults:
      run:
        working-directory: user-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ vars.USER_SERVICE_PYTHON_VERSION || '3.10' }}
          cache: "pip"
          cache-dependency-path: "user-service/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov

      - name: Run tests
        env:
          SECRET_KEY: ${{ secrets.USER_SERVICE_SECRET_KEY }}
          DEBUG: ${{ vars.USER_SERVICE_DEBUG || 'False' }}
          DATABASE_URL: ${{ secrets.USER_SERVICE_DATABASE_URL }}
          DJANGO_SETTINGS_MODULE: user_service.settings
        run: |
          pytest --cov=accounts --cov-report=xml --cov-report=term -v

      - name: Build Docker image
        run: |
          docker build -t user-service:latest .

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./user-service/coverage.xml
          flags: user-service

  # Push Service - FastAPI with uv
  push-service:
    name: Push Service (FastAPI + uv)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.push-service == 'true'
    defaults:
      run:
        working-directory: push-service

    services:
      redis:
        image: ${{ vars.REDIS_IMAGE || 'redis:7-alpine' }}
        ports:
          - ${{ vars.REDIS_PORT || '6379' }}:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval ${{ vars.HEALTH_CHECK_INTERVAL || '10s' }}
          --health-timeout ${{ vars.HEALTH_CHECK_TIMEOUT || '5s' }}
          --health-retries ${{ vars.HEALTH_CHECK_RETRIES || '5' }}

      rabbitmq:
        image: ${{ vars.RABBITMQ_IMAGE || 'rabbitmq:3-management-alpine' }}
        ports:
          - ${{ vars.RABBITMQ_PORT || '5672' }}:5672
          - ${{ vars.RABBITMQ_MGMT_PORT || '15672' }}:15672
        env:
          RABBITMQ_DEFAULT_USER: ${{ vars.RABBITMQ_USER || 'guest' }}
          RABBITMQ_DEFAULT_PASS: ${{ secrets.RABBITMQ_PASSWORD || 'guest' }}
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval ${{ vars.HEALTH_CHECK_INTERVAL || '10s' }}
          --health-timeout ${{ vars.HEALTH_CHECK_TIMEOUT || '5s' }}
          --health-retries ${{ vars.HEALTH_CHECK_RETRIES || '5' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ vars.PUSH_SERVICE_PYTHON_VERSION || '3.11' }}

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache uv dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('push-service/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv sync

      - name: Lint with ruff
        run: |
          source .venv/bin/activate
          uv run ruff check .

      - name: Check formatting
        run: |
          source .venv/bin/activate
          uv run ruff format --check .

      - name: Run tests
        env:
          REDIS_HOST: ${{ vars.REDIS_HOST || 'localhost' }}
          REDIS_PORT: ${{ vars.REDIS_PORT || '6379' }}
          RABBITMQ_HOST: ${{ vars.RABBITMQ_HOST || 'localhost' }}
          RABBITMQ_PORT: ${{ vars.RABBITMQ_PORT || '5672' }}
          RABBITMQ_USER: ${{ secrets.RABBITMQ_USER }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          FCM_ENABLED: ${{ vars.PUSH_FCM_ENABLED || 'false' }}
          WEB_PUSH_ENABLED: ${{ vars.PUSH_WEB_PUSH_ENABLED || 'false' }}
          USER_SERVICE_URL: ${{ vars.USER_SERVICE_URL || '' }}
          TEMPLATE_SERVICE_URL: ${{ vars.TEMPLATE_SERVICE_URL || '' }}
          USE_DUMMY_DEVICE_TOKENS: ${{ vars.USE_DUMMY_DEVICE_TOKENS || 'true' }}
          USE_DUMMY_TEMPLATES: ${{ vars.USE_DUMMY_TEMPLATES || 'true' }}
        run: |
          source .venv/bin/activate
          uv run pytest tests/ -v --cov=app --cov-report=xml --cov-report=term

      - name: Build Docker image
        run: |
          docker build -t push-service:latest .

      - name: Test Docker image
        env:
          SERVICE_PORT: ${{ vars.PUSH_SERVICE_PORT || '8003' }}
          HEALTH_ENDPOINT: ${{ vars.PUSH_SERVICE_HEALTH_ENDPOINT || '/api/v1/health' }}
          STARTUP_WAIT_SECONDS: ${{ vars.DOCKER_STARTUP_WAIT || '10' }}
        run: |
          docker run --rm -d \
            --name push-service-test \
            --network host \
            -e REDIS_HOST=localhost \
            -e REDIS_PORT=6379 \
            -e RABBITMQ_HOST=localhost \
            -e RABBITMQ_PORT=5672 \
            -e RABBITMQ_USER=${{ vars.RABBITMQ_USER || 'guest' }} \
            -e RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD || 'guest' }} \
            -e FCM_ENABLED=${{ vars.PUSH_FCM_ENABLED || 'false' }} \
            -e WEB_PUSH_ENABLED=${{ vars.PUSH_WEB_PUSH_ENABLED || 'false' }} \
            -e USE_DUMMY_DEVICE_TOKENS=${{ vars.USE_DUMMY_DEVICE_TOKENS || 'true' }} \
            -e USE_DUMMY_TEMPLATES=${{ vars.USE_DUMMY_TEMPLATES || 'true' }} \
            push-service:latest

          # Wait for service to start
          sleep $STARTUP_WAIT_SECONDS

          # Test health endpoint
          curl -f http://localhost:$SERVICE_PORT$HEALTH_ENDPOINT || exit 1

          # Cleanup
          docker stop push-service-test

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./push-service/coverage.xml
          flags: push-service

  # Email Service - NestJS/TypeScript
  nodejs-build:
    name: Node.js Services Build
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.nodejs == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODEJS_VERSION || '20' }}
          cache: ${{ hashFiles('package-lock.json') != '' || hashFiles('email-service/package-lock.json') != '' && 'npm' || '' }}
          cache-dependency-path: |
            package-lock.json
            email-service/package-lock.json

      - name: Install Node.js dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            echo "Installing root dependencies..."
            npm install
          fi
          if [ -f "email-service/package-lock.json" ]; then
            echo "Installing email-service dependencies..."
            cd email-service
            npm install
            cd ..
          fi

      - name: Lint with ESLint
        run: |
          if [ -f "package.json" ]; then
            if npm run | grep -q "lint"; then
              npm run lint
            else
              echo "Lint script not found in root package.json, skipping..."
            fi
          elif [ -f "email-service/package.json" ]; then
            cd email-service
            if npm run | grep -q "lint"; then
              npm run lint
            else
              echo "Lint script not found in email-service, skipping..."
            fi
          fi

      - name: Check formatting with Prettier
        run: |
          if [ -f "package.json" ]; then
            if npm run | grep -q "format:check"; then
              npm run format:check
            else
              echo "Format check script not found in root package.json, skipping..."
            fi
          elif [ -f "email-service/package.json" ]; then
            cd email-service
            if npm run | grep -q "format:check"; then
              npm run format:check
            else
              echo "Format check script not found in email-service, skipping..."
            fi
          fi

      - name: Type check with TypeScript
        run: |
          if [ -f "package.json" ]; then
            if npm run | grep -q "type-check"; then
              npm run type-check
            else
              echo "Type check script not found in root package.json, skipping..."
            fi
          elif [ -f "email-service/package.json" ]; then
            cd email-service
            if npm run | grep -q "type-check"; then
              npm run type-check
            else
              echo "Type check script not found in email-service, skipping..."
            fi
          fi

      - name: Run unit tests
        run: |
          if [ -f "package.json" ]; then
            if npm run | grep -q "test:cov"; then
              npm run test:cov
            elif npm run | grep -q "test"; then
              npm run test
            else
              echo "Test script not found in root package.json, skipping..."
            fi
          elif [ -f "email-service/package.json" ]; then
            cd email-service
            if npm run | grep -q "test:cov"; then
              npm run test:cov
            elif npm run | grep -q "test"; then
              npm run test
            else
              echo "Test script not found in email-service, skipping..."
            fi
          fi

      - name: Build Email Service Docker image
        if: needs.detect-changes.outputs.email-service == 'true'
        run: |
          if [ -f "email-service/Dockerfile" ]; then
            docker build -t email-service:latest ./email-service
          fi

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/coverage-final.json
          flags: nodejs
