name: Notification Distribution Service CI
on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
permissions:
  contents: read
jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      nodejs: ${{ steps.filter.outputs.nodejs }}
      user-service: ${{ steps.filter.outputs.user-service }}
      email-service: ${{ steps.filter.outputs.email-service }}
      push-service: ${{ steps.filter.outputs.push-service }}
      template-service: ${{ steps.filter.outputs.template-service }}
      api-gateway: ${{ steps.filter.outputs.api-gateway }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            python:
              - '**/*.py'
              - '**/requirements.txt'
              - 'pyproject.toml'
              - 'ruff.toml'
              - 'pytest.ini'
              - '.github/workflows/**'
            nodejs:
              - '**/*.ts'
              - '**/*.js'
              - '*.json'
              - '.eslintrc.js'
              - '.prettierrc'
              - '.github/workflows/**'
            user-service:
              - 'user-service/**'
            email-service:
              - 'email-service/**'
            push-service:
              - 'push-service/**'
            template-service:
              - 'template-service/**'
            api-gateway:
              - 'api-gateway/**'

  python-build:
    name: Python microservice-notification-distribution-system Build
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.python == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"
      
      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov pytest-asyncio
          
          echo "Installing service dependencies..."
          
          # Install dependencies from each service explicitly
          for service in user-service email-service push-service template-service; do
            if [ -f "$service/requirements.txt" ]; then
              echo "Found and installing dependencies for $service"
              pip install -r "$service/requirements.txt"
            else
              echo "No requirements.txt found for $service"
            fi
          done
          
          # Install root requirements if exists
          if [ -f requirements.txt ]; then
            echo "Installing root requirements.txt"
            pip install -r requirements.txt
          fi
          
          echo "Verifying Django installation..."
          pip list | grep -i django
      
      - name: Lint with ruff
        run: |
          ruff check . --select=E9,F63,F7,F82 --output-format=github
          ruff check . --output-format=github
      
      - name: Check formatting with ruff
        run: |
          ruff format --check .
      
      - name: Test Python microservice-notification-distribution-system
        run: |
          pytest --cov=. --cov-report=xml --cov-report=term -v
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: python

  nodejs-build:
    name: Node.js microservice-notification-distribution-system Build
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.nodejs == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install Node.js dependencies
        run: |
          npm ci
      
      - name: Lint with ESLint
        run: |
          npm run lint
      
      - name: Check formatting with Prettier
        run: |
          npm run format:check
      
      - name: Type check with TypeScript
        run: |
          npm run type-check
      
      - name: Run unit tests
        run: |
          npm run test:cov
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/coverage-final.json
          flags: nodejs