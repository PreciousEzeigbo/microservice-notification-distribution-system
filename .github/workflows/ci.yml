name: Notification Distribution Service CI
on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
permissions:
  contents: read
jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      nodejs: ${{ steps.filter.outputs.nodejs }}
      user-service: ${{ steps.filter.outputs.user-service }}
      email-service: ${{ steps.filter.outputs.email-service }}
      push-service: ${{ steps.filter.outputs.push-service }}
      template-service: ${{ steps.filter.outputs.template-service }}
      api-gateway: ${{ steps.filter.outputs.api-gateway }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            python:
              - 'user-service/**/*.py'
              - 'email-service/**/*.py'
              - 'push-service/**/*.py'
              - 'template-service/**/*.py'
              - 'user-service/**/requirements.txt'
              - 'email-service/**/requirements.txt'
              - 'push-service/**/requirements.txt'
              - 'template-service/**/requirements.txt'
              - 'pyproject.toml'
              - 'ruff.toml'
              - 'pytest.ini'
            nodejs:
              - 'email-service/**/*.ts'
              - 'email-service/**/*.js'
              - 'email-service/**/*.json'
              - 'api-gateway/**/*.ts'
              - 'api-gateway/**/*.js'
              - 'api-gateway/**/*.json'
              - 'email-service/.eslintrc.js'
              - 'email-service/.prettierrc'
              - 'api-gateway/.eslintrc.js'
              - 'api-gateway/.prettierrc'
            user-service:
              - 'user-service/**'
            email-service:
              - 'email-service/**'
            push-service:
              - 'push-service/**'
            template-service:
              - 'template-service/**'
            api-gateway:
              - 'api-gateway/**'

  python-build:
    name: Python microservice-notification-distribution-system Build
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.python == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"
      
      # Temporarily disabled to clear cache
      # - name: Cache Python dependencies
      #   uses: actions/cache@v3
      #   with:
      #     path: ~/.cache/pip
      #     key: ${{ runner.os }}-pip-v2-${{ hashFiles('**/requirements.txt') }}
      #     restore-keys: |
      #       ${{ runner.os }}-pip-v2-
      
      - name: Install Python dependencies
        shell: bash
        run: |
          set -x
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov pytest-asyncio
          echo "Installing service dependencies..."
          if [ -f "user-service/requirements.txt" ]; then
            echo "Found user-service/requirements.txt"
            pip install -r user-service/requirements.txt
          fi
          if [ -f "email-service/requirements.txt" ]; then
            echo "Found email-service/requirements.txt"
            pip install -r email-service/requirements.txt
          fi
          if [ -f "push-service/requirements.txt" ]; then
            echo "Found push-service/requirements.txt"
            pip install -r push-service/requirements.txt
          fi
          if [ -f "template-service/requirements.txt" ]; then
            echo "Found template-service/requirements.txt"
            pip install -r template-service/requirements.txt
          fi
          if [ -f "requirements.txt" ]; then
            echo "Found root requirements.txt"
            pip install -r requirements.txt
          fi
          echo "Verifying installed packages..."
          pip list
      
      - name: Lint with ruff
        run: |
          ruff check . --select=E9,F63,F7,F82 --output-format=github
          ruff check . --output-format=github
      
      - name: Check formatting with ruff
        run: |
          ruff format --check .
      
      - name: Test Python microservice-notification-distribution-system
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: ${{ secrets.DEBUG }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SETTINGS_MODULE: user_service.settings
        run: |
          pytest --cov=. --cov-report=xml --cov-report=term -v
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: python

  nodejs-build:
    name: Node.js microservice-notification-distribution-system Build
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.nodejs == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Only enable cache if lock file exists at root or in email-service
          cache: ${{ hashFiles('package-lock.json') != '' || hashFiles('email-service/package-lock.json') != '' && 'npm' || '' }}
          cache-dependency-path: |
            package-lock.json
            email-service/package-lock.json
      
      - name: Install Node.js dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            echo "Installing root dependencies..."
            npm install
          fi
          if [ -f "email-service/package-lock.json" ]; then
            echo "Installing email-service dependencies..."
            cd email-service
            npm install
            cd ..
          fi
      
      - name: Lint with ESLint
        run: |
          if [ -f "package.json" ]; then
            if npm run | grep -q "lint"; then
              npm run lint
            else
              echo "Lint script not found in root package.json, skipping..."
            fi
          elif [ -f "email-service/package.json" ]; then
            cd email-service
            if npm run | grep -q "lint"; then
              npm run lint
            else
              echo "Lint script not found in email-service, skipping..."
            fi
          fi
      
      - name: Check formatting with Prettier
        run: |
          if [ -f "package.json" ]; then
            if npm run | grep -q "format:check"; then
              npm run format:check
            else
              echo "Format check script not found in root package.json, skipping..."
            fi
          elif [ -f "email-service/package.json" ]; then
            cd email-service
            if npm run | grep -q "format:check"; then
              npm run format:check
            else
              echo "Format check script not found in email-service, skipping..."
            fi
          fi
      
      - name: Type check with TypeScript
        run: |
          if [ -f "package.json" ]; then
            if npm run | grep -q "type-check"; then
              npm run type-check
            else
              echo "Type check script not found in root package.json, skipping..."
            fi
          elif [ -f "email-service/package.json" ]; then
            cd email-service
            if npm run | grep -q "type-check"; then
              npm run type-check
            else
              echo "Type check script not found in email-service, skipping..."
            fi
          fi
      
      - name: Run unit tests
        run: |
          if [ -f "package.json" ]; then
            if npm run | grep -q "test:cov"; then
              npm run test:cov
            elif npm run | grep -q "test"; then
              npm run test
            else
              echo "Test script not found in root package.json, skipping..."
            fi
          elif [ -f "email-service/package.json" ]; then
            cd email-service
            if npm run | grep -q "test:cov"; then
              npm run test:cov
            elif npm run | grep -q "test"; then
              npm run test
            else
              echo "Test script not found in email-service, skipping..."
            fi
          fi
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/coverage-final.json
          flags: nodejs