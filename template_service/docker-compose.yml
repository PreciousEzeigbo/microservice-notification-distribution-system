version: '3.8'

services:
  template-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: template_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - template_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  template-service:
    build: .
    ports:
      - "3002:3002"
    environment:
      - DJANGO_SECRET_KEY=dev-secret-key-change-in-production
      - DEBUG=True
      - ALLOWED_HOSTS=*
      - DB_NAME=template_service
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=template-db
      - DB_PORT=5432
    depends_on:
      template-db:
        condition: service_healthy
    volumes:
      - .:/app
    command: sh -c "gunicorn template_service.wsgi:application --bind 0.0.0.0:3002 --workers 4 --reload"

volumes:
  template_db_data: